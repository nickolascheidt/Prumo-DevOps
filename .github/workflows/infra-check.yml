name: infra-check

# Needs no credentials and no account: `-backend=false` skips the S3 backend, so the job
# checks syntax, types and the provider schema without ever talking to AWS. A real `plan`
# needs a credential and stays a workstation job (scripts/aws/bootstrap-dev.sh).

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra-check.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # The S3 backend's `use_lockfile` needs >= 1.10; see terraform/aws/dev/versions.tf.
          terraform_version: "1.15.5"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (no backend)
        working-directory: terraform/aws/dev
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform/aws/dev
        run: terraform validate
