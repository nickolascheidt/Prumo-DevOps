services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the certificate across restarts. Destroying this volume and re-applying
      # many times in one day runs into Let's Encrypt's issuance limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    image: ${ECR_REGISTRY}/prumo-web:${WEB_TAG}
    restart: unless-stopped
    environment:
      # Read by the nginx entrypoint's envsubst, in `proxy_pass ${API_URL};` and
      # `proxy_set_header Host ${API_HOST};`. The second must be the public domain: the
      # API runs with AllowedHosts=${DOMAIN} (below) and ASP.NET host filtering returns
      # 400 for any other Host. Without it the image default (localhost:5201) applied and
      # every API call was refused.
      API_URL: http://api:8080
      API_HOST: ${DOMAIN}

  api:
    image: ${ECR_REGISTRY}/prumo-api:${API_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: ${DOMAIN}
      App__BaseUrl: https://${DOMAIN}
      Cors__AllowedOrigins__0: https://${DOMAIN}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=prumo;Username=prumo_app;Password=${PRUMO_APP_PASSWORD}
      ConnectionStrings__MigratorConnection: Host=postgres;Port=5432;Database=prumo;Username=prumo_migrator;Password=${PRUMO_MIGRATOR_PASSWORD}
      # On because the deploy has no migration step. It runs over the migrator
      # connection, never the app's. The piece to replace if the compute changes.
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prumo
      PRUMO_MIGRATOR_PASSWORD: ${PRUMO_MIGRATOR_PASSWORD}
      PRUMO_APP_PASSWORD: ${PRUMO_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only runs on a new volume, as in local development.
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
